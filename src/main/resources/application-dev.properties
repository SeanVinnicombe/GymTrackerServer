
#DB config
spring.datasource.url= ${DB_URL_DEV}
spring.datasource.username=${DB_USERNAME_DEV}
spring.datasource.password=${DB_PASSWORD_DEV}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#logging.level.org.flywaydb=DEBUG

spring.flyway.url=${DB_URL_DEV}
spring.flyway.user=${DB_USERNAME_DEV}
spring.flyway.password=${DB_PASSWORD_DEV}

#Logging config
#logging.level.org.springframework.security=DEBUG
#logging.level.com.github.seanv.gymtracker=DEBUG


#Security config
jwt.secret = ${JWT_SECRET_DEV}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=gymtracker-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*