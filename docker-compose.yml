services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: GymTracker
      POSTGRES_USER: ${DB_USERNAME_DEV}
      POSTGRES_PASSWORD: ${DB_PASSWORD_DEV}
    ports:
      - "5432:5432"
    volumes:
      - gymtracker_data:/var/lib/postgresql/data
    networks:
      - gymtracker_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: gymtracker-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - gymtracker_network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

#  Notice — no build, no environment variables, no profile. Just the structural definition.
  app:
    restart: on-failure
    ports:
      - "8087:8087"
    depends_on:
      db:
          condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gymtracker_network
#    environment:
#      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

volumes:
  gymtracker_data:

networks:
  gymtracker_network: