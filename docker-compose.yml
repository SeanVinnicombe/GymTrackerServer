services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: GymTracker
      POSTGRES_USER: ${DB_USERNAME_DEV}
      POSTGRES_PASSWORD: ${DB_PASSWORD_DEV}
    ports:
      - "5432:5432"
    volumes:
      - gymtracker_data:/var/lib/postgresql/data
    networks:
      - gymtracker_network

#  Notice — no build, no environment variables, no profile. Just the structural definition.
  app:
    restart: on-failure
    ports:
      - "8087:8087"
    depends_on:
      - db
    networks:
      - gymtracker_network

volumes:
  gymtracker_data:

networks:
  gymtracker_network: